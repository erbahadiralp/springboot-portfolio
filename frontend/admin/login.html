<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş · Admin</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <script src="js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts CSS'i tarayıcıya göre farklı içerik döndürdüğü için SRI uygulanamaz; CSP ile sınırlandırıldı. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <div class="auth">
        <div class="auth-form">
            <a href="../index.html" class="brand">
                <span class="brand-mark">&gt;_</span>
                <span>admin</span>
            </a>

            <h1>Tekrar hoş geldin</h1>
            <p class="text-muted mb-4">Portfolyo içeriklerini yönetmek için giriş yap.</p>

            <div class="alert alert-danger py-2" id="login-alert" role="alert" hidden></div>
            <div class="alert alert-warning py-2 small" id="login-info" role="status" hidden></div>

            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label" for="username">Kullanıcı adı</label>
                    <input id="username" type="text" name="username" class="form-control" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Şifre</label>
                    <input id="password" type="password" name="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Giriş yap <i class="bi bi-arrow-right"></i></button>
            </form>

            <a href="../index.html" class="text-muted small mt-4"><i class="bi bi-arrow-left"></i> Siteye dön</a>
        </div>

        <div class="auth-art" aria-hidden="true">
            <div class="terminal">
                <div class="terminal-bar"><span></span><span></span><span></span></div>
                <div class="terminal-body">
                    <div><span class="p">$</span> <span class="hl">ssh admin@bahadiralper.com</span></div>
                    <div><span class="ok">✓</span> bağlantı kuruldu</div>
                    <div><span class="p">$</span> <span class="hl">portfolio status</span></div>
                    <div>eğitim · deneyim · projeler · sertifikalar</div>
                    <div><span class="ok">●</span> yayında</div>
                    <div><span class="p">$</span> <span class="cursor"></span></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/constants.js"></script>
    <script src="../assets/js/util.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
