# nginx yapılandırması (compose.yaml: /etc/nginx/conf.d/default.conf)
# - frontend/ klasörünü sunar
# - /api/ ve /static/ isteklerini backend'e (Spring Boot, servis adı "backend") iletir
# TLS bu katmanda değil; önde Cloudflare (proxy ya da Tunnel) varsayılır.

# ---------------- Gerçek istemci IP'si ----------------
# Cloudflare'in arkasında $remote_addr Cloudflare'in IP'sidir; deneme sınırları herkese ortak uygulanmasın diye
# gerçek IP CF-Connecting-IP başlığından alınır. Başlığa yalnızca Cloudflare'in adreslerinden gelirse güvenilir;
# doğrudan sunucuya gelen biri sahte başlıkla sınırı atlatamaz.
# Kaynak: https://www.cloudflare.com/ips (değişirse güncelle)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# Cloudflare Tunnel (cloudflared) aynı Docker ağında çalışacaksa istekler onun iç IP'sinden gelir;
# o durumda aşağıdaki satırı aç. Tunnel yoksa kapalı kalsın (aksi halde sınır sahte başlıkla atlatılabilir).
# set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

# ---------------- Deneme sınırları ----------------
# Yalnızca POST sayılır: admin paneli aynı adreslerden GET ile okuma yapıyor, ona sınır olmasın.
map $request_method $post_client {
    default "";
    POST    $binary_remote_addr;
}
# İletişim formu: dakikada 3 mesaj (+2 ani)
limit_req_zone $post_client zone=contact:10m rate=3r/m;
# Admin girişi: dakikada 5 deneme (+5 ani). Kaba kuvvet şifre denemesine karşı.
limit_req_zone $post_client zone=login:10m rate=5r/m;

# Admin paneli ve API arama motorlarında indekslenmesin. Boş değer başlığı göndermez.
map $uri $robots_tag {
    default   "";
    ~^/admin/ "noindex, nofollow";
    ~^/api/   "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/css text/javascript application/javascript application/json;

    # Varsayılan 1 MB dosya yüklemeyi bozar. En büyük dosya 10 MB PDF + form verisi.
    client_max_body_size 12m;

    # Deneme sınırı aşılınca 429 (nginx varsayılanı 503)
    limit_req_status 429;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------- Güvenlik başlıkları ----------------
    # Konumlarda add_header KULLANMA: nginx'te bir konumda add_header varsa sunucu düzeyindekiler o konuma
    # hiç uygulanmaz. Önbellek ayarı bu yüzden "expires" ile yapılıyor.
    #
    # CSP notları:
    # - script-src: satır içi script yok (admin tema scripti js/theme-init.js'te), 'unsafe-inline' / 'unsafe-eval' gerekmez.
    #   jsdelivr: Bootstrap, Fancybox, pdf.js. challenges.cloudflare.com: Turnstile.
    # - style-src 'unsafe-inline': JS'in ürettiği HTML'de style="..." öznitelikleri var (logo kutuları, önizlemeler)
    #   ve Fancybox/Turnstile satır içi stil kullanıyor. Stil enjeksiyonu script çalıştıramaz; risk düşük.
    # - worker-src blob: pdf.js, CDN'deki worker dosyasını blob: URL'li bir worker içinde importScripts ile açar.
    # - img-src data: blob:: Bootstrap'in SVG ikonları data: URI; admin'deki dosya önizlemeleri blob: URL.
    # - frame-src: Turnstile kendi iframe'inde çalışır.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self'; worker-src blob:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Robots-Tag $robots_tag always;

    # ---------------- Hata sayfaları (frontend/errors/) ----------------
    # 502 / 503 / 504 kullanıcı için aynı durum: sunucu yanıt vermiyor.
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;
    error_page 502 503 504 /errors/503.html;

    # ---------------- Sunulmayacak dosyalar ----------------
    # Gizli dosyalar (.git, .env ...). Regex konumlarında ilk eşleşen kazandığı için en başta.
    location ~ /\. {
        return 404;
    }
    # Geliştirme dosyaları ve belgeler (server.js, package.json, README.md, API.md)
    location ~* ^/(server\.js|package(-lock)?\.json)$ {
        return 404;
    }
    location ~* \.md$ {
        return 404;
    }

    # ---------------- Backend ----------------
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    location = /api/contact-messages {
        limit_req zone=contact burst=2 nodelay;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    # ^~ : bu önek eşleşince aşağıdaki regex konumlarına (ör. \.png$) bakılmaz; /static/x.png backend'e gider.
    location ^~ /api/ {
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    # Yüklenen dosyalar: adları UUID, içerikleri hiç değişmez; uzun süre önbelleğe alınabilir.
    location ^~ /static/ {
        expires 30d;
        include /etc/nginx/conf.d/backend-proxy.inc;
    }

    # Backend'e ulaşılamazsa (502/504) site ve admin paneli hata mesajını JSON'dan okur; HTML sayfa değil JSON dön.
    location @backend_unavailable {
        default_type application/json;
        return 503 '{"message":"Sunucuya şu an ulaşılamıyor. Lütfen biraz sonra tekrar deneyin.","errors":null}';
    }

    # Deneme sınırı aşıldı (limit_req)
    location @too_many_requests {
        default_type application/json;
        return 429 '{"message":"Çok fazla istek gönderildi. Lütfen biraz bekleyip tekrar deneyin.","errors":null}';
    }

    # ---------------- Statik dosyalar ----------------
    # Dosya adlarında sürüm/hash yok: HTML, JS ve CSS her açılışta sunucuya sorulsun (değişmediyse 304, ucuz).
    # Böylece yeni sürüm yayınlanınca ziyaretçi eski JS'i önbellekten kullanmaz.
    location ~* \.(?:html|js|css)$ {
        expires -1;
    }

    location ~* \.(?:png|jpe?g|webp|svg|ico|woff2?)$ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
