name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      - name: Run tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Build Docker image
        run: docker build -t portfolio-backend:ci backend

      - name: Build nginx image
        run: docker build -f nginx/Dockerfile -t portfolio-nginx:ci .
