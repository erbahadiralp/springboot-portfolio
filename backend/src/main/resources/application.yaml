spring:
  application:
    name: portfolio-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${SPRING_DATASOURCE_USERNAME:portfolio}
    password: ${SPRING_DATASOURCE_PASSWORD:portfolio123}

app:
  jwt:
    # Varsayılan yok: JWT_SECRET tanımlı değilse uygulama açılmaz.
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  turnstile:
    secret: ${TURNSTILE_SECRET:}
    allowed-hostnames: ${TURNSTILE_ALLOWED_HOSTNAMES:}